services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: crud_recuperacao
    ports:
      - "3306:3306"
    volumes:
      - dados_mysql:/var/lib/mysql
      # Executa o banco.sql automaticamente quando o banco é criado do zero
      - ./banco.sql:/docker-entrypoint-initdb.d/banco.sql

  phpmyadmin:
    image: phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  dados_mysql:
